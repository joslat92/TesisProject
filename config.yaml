# config.yaml - SINGLE SOURCE OF TRUTH (SSOT)
project:
  name: "Tesis MMACC: Sentiment & VIX vs Market Efficiency"
  version: "2.1.0 (Canonical + Params)"
  seed: 42

# --- 1. DATOS ---
data:
  raw_source: "data/curated/model_input_ndx.csv"
  freq: "B"
  target_col: "Target_Price"
  
  splits:
    train_end: "2023-12-29"
    oos_start: "2024-01-02"
    oos_end:   "2024-12-31"
    wf_year: 2024
    wf_blocks: 12

# --- 2. FEATURES ---
features:
  horizons: [1, 5, 10, 20]
  
  exog:
    Sentiment_GDELT: [1, 2, 5, 10, 15]
    VIX_Close: [1, 2, 5, 10, 15]
  
  target_transform: "log_return_accumulated"

# --- 3. MODELOS Y PARÁMETROS ---
models:
  active_models:
    - RW
    - ARIMA
    - ARIMAX
    - SARIMAX
    - LSTM
    - LSTM_SENT
    - LSTM_FULL

  params:
    rw:
      strategy: "zero_return"
    
    arima:
      # Orden sobre retornos diarios (ret_1d = diff(logP)): d=0 porque la serie
      # ya está diferenciada; equivale a ARIMA(1,1,1) sobre logP.
      order: [1, 0, 1]
    
    sarimax:
      # NOTA: el orden no-estacional (p,d,q) del SARIMAX NO se lee de aquí.
      # Los stages 13/14/16 reutilizan arima.order [1,0,1] sobre ret_1d para
      # mantener una sola fuente de verdad del componente ARMA; este campo
      # quedaba muerto (y además inconsistente: [1,1,1] re-diferenciaba una
      # serie ya estacionaria). Eliminado para evitar confusión.
      seasonal_order: [0, 1, 0, 5]
      
    lstm:
      strategy: "direct_horizon"
      # HPs canónicos de la tesis: window=40, hidden=64, dropout=0.2,
      # Adam lr=0.001, epochs=30, batch=64, seed=42, early-stopping val 20%.
      seq_len: 40
      hidden_dim: 64
      dropout: 0.2
      lr: 0.001
      epochs: 30
      batch_size: 64
      patience: 5
      val_frac: 0.20
      # Predicción directa: una red separada aprende Target_Ret_h{h} para cada
      # horizonte. La ventana termina en la fecha de origen t. Exógenas
      # SIEMPRE rezagadas (lag1); la ventana aporta la historia de cada canal.
      variants:
        LSTM:      ["ret_1d"]
        LSTM_SENT: ["ret_1d", "Sentiment_GDELT_lag1"]
        LSTM_FULL: ["ret_1d", "Sentiment_GDELT_lag1", "VIX_Close_lag1"]

# --- 4. RUTAS (PATHS) ---
paths:
  splits_json: "data/processed/splits.json"
  features_parquet_pattern: "data/processed/features_T{h}.parquet"
  metadata_snapshot: "reports/data/metadata_snapshot.csv"

  preds_oos_dir: "outputs/preds/OOS"
  preds_wf_dir:  "outputs/preds/WF"
  figures_dir:   "reports/figs"
  
  metrics_oos: "reports/data/metrics_OOS.csv"
  metrics_wf:  "reports/data/metrics_WF.csv"
  dm_results:  "reports/data/dm_summary.csv"
  mz_results:  "reports/data/tbl_MZ_core.csv"

# --- 5. CONTRATO (VALIDACIONES) ---
contract:
  naming:
    oos: "preds_T{h}_{model}.csv"
    wf:  "preds_T{h}_{model}_block{b}.csv"
  
  columns_required:
    - Date
    - h
    - model
    - y_true_ret
    - y_pred_ret
    - y_true_level
    - y_pred_level
  
  columns_wf_extra:
    - block
